name: Validate Loci contract

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/validate-contract.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/validate-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install validator dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Validate contract examples
        run: python contracts/validate.py
