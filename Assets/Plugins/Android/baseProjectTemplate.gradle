plugins {
    // If you are changing the Android Gradle Plugin version, make sure it is compatible with the Gradle version preinstalled with Unity
    // See which Gradle version is preinstalled with Unity here https://docs.unity3d.com/Manual/android-gradle-overview.html
    // See official Gradle and Android Gradle Plugin compatibility table here https://developer.android.com/studio/releases/gradle-plugin#updating-gradle
    // To specify a custom Gradle version in Unity, go do "Preferences > External Tools", uncheck "Gradle Installed with Unity (recommended)" and specify a path to a custom Gradle version
    id 'com.android.application' version '9.0.0' apply false
    id 'com.android.library' version '9.0.0' apply false
    **BUILD_SCRIPT_DEPS**
}

// Phase 48, Round 4 — fixes the real build error from Round 3:
// ":launcher:checkReleaseDuplicateClasses" failed with ~15 "Duplicate class
// kotlin.*" errors between kotlin-stdlib-1.8.22.jar and
// kotlin-stdlib-jdk7-1.6.21.jar / kotlin-stdlib-jdk8-1.6.21.jar.
//
// Why this happens: androidx.core:core:1.13.1 (added to mainTemplate.gradle
// in Round 3, for FileProvider) pulls in org.jetbrains.kotlin:kotlin-stdlib
// version 1.8.22 — confirmed from the real error log, not guessed. Kotlin
// 1.8.0 merged the JDK7/JDK8 extension classes directly into kotlin-stdlib
// itself, so from 1.8.0 onward kotlin-stdlib-jdk7 and kotlin-stdlib-jdk8 are
// empty "stub" artifacts that just point back at kotlin-stdlib. But
// something else already in this project's dependency graph (most likely
// one of Unity/AR Foundation's own bundled AARs — this project already has
// an auto-generated xrmanifest.androidlib module, for example) still pulls
// the OLD, pre-merge kotlin-stdlib-jdk7:1.6.21 / kotlin-stdlib-jdk8:1.6.21,
// which DO contain their own real copies of those classes.
//
// kotlin-stdlib and kotlin-stdlib-jdk7/jdk8 are three different Gradle
// artifact IDs, so Gradle's normal "highest version wins" conflict
// resolution never compares them against each other — it only deduplicates
// different versions of the SAME group:artifact. That's exactly why both a
// real 1.6.21 copy and a real 1.8.22 copy of the same classes ended up on
// the classpath, and why the build correctly refused to proceed.
//
// The fix: force every module's kotlin-stdlib / kotlin-stdlib-jdk7 /
// kotlin-stdlib-jdk8 to the SAME 1.8.22 version already confirmed present
// in the real error log. At 1.8.22 the jdk7/jdk8 artifacts are the empty
// stub form, so only one real copy of each class remains. This is declared
// with "subprojects" here, in the ROOT build.gradle, rather than only
// inside unityLibrary's own mainTemplate.gradle, so it also covers
// launcher and any other Android Library module the project generates
// (e.g. AR Foundation's xrmanifest.androidlib) — not just unityLibrary.
//
// If a future build reports the same "Duplicate class kotlin.*" error for a
// different Kotlin artifact name (e.g. kotlin-stdlib-common), add another
// force line here for that exact name — same version, same reasoning.
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
